<svg width="200" height="200" viewBox="0 0 120 108" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect x="14" y="8" width="92" height="92" rx="22" fill="#F5F0E8"/>
  <rect x="17" y="11" width="86" height="86" rx="19" fill="#2C2C2C"/>
  <!-- F letter -->
  <text x="55" y="70" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-size="52" font-weight="bold" fill="#F5F0E8">F</text>
  <!-- Animated blinking cursor -->
  <rect x="76" y="38" width="2.5" height="28" rx="1.25" fill="#8C8278">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
